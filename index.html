<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медиа Портал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">MediaHub</div>
    <input type="text" class="search-bar" placeholder="Поиск контента...">
    <button class="btn-login">Войти</button>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h3>Категории</h3>
      <ul>
        <li><a href="#">Популярное</a></li>
        <li><a href="#">Новые поступления</a></li>
        <li><a href="#">Фотогалереи</a></li>
        <li><a href="#">Подборки</a></li>
        <li><a href="#">Избранное</a></li>
      </ul>
    </aside>

    <main class="content">
      <h2>Галерея</h2>
      <div class="grid">
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>Альбом 1</h4>
            <p>12 фото</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>Альбом 2</h4>
            <p>8 фото</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>Альбом 3</h4>
            <p>24 фото</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>Альбом 4</h4>
            <p>15 фото</p>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
