<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Медиа Портал</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">MediaHub</div>
    <input type="text" class="search-bar" placeholder="Поиск контента...">
    <button class="btn-login">Войти</button>
  </header>

  <div class="container">
    <aside class="sidebar">
      <h3>Категории</h3>
      <ul>
        <li><a href="#">эльхан хуй</a></li>
        <li><a href="#">эльхан соси</a></li>
        <li><a href="#">адил еблан</a></li>
        <li><a href="#">адил тоже соси хуй</a></li>
        <li><a href="#">бека крачавчик</a></li>
      </ul>
    </aside>

    <main class="content">
      <h2>Галерея</h2>
      <div class="grid">
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>адил еблан</h4>
            <p>12 фото</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>эльхан ебан</h4>
            <p>сосите все хуи</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>бека красавчик</h4>
            <img scr="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRTMyuQUukHPwJKCRKWiWywt7jKM5A6T4qxTcnuwuB9sA&s=10" alt="сосал"
            <p>и это факт</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image"></div>
          <div class="card-info">
            <h4>адил сосал 14метровый член</h4>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaSTcDsSCmy7fcGADtXvpRgKsAuP9nSvs-43J_R_jadsoRzThiGpmKYwcC&s=10" alt="пидор">
            <p>15 фото</p>
          </div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
